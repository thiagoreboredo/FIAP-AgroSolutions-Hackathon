version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agrosolutions
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  identity-service:
    build:
      context: .
      dockerfile: src/IdentityService/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=identity_db;Username=postgres;Password=postgres
      - Jwt__Key=AgroSolutions-Secret-Key-For-JWT-Authentication-2024
      - Jwt__Issuer=AgroSolutions
      - Jwt__Audience=AgroSolutions
    depends_on:
      postgres:
        condition: service_healthy

  property-service:
    build:
      context: .
      dockerfile: src/PropertyService/Dockerfile
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=property_db;Username=postgres;Password=postgres
      - Jwt__Key=AgroSolutions-Secret-Key-For-JWT-Authentication-2024
      - Jwt__Issuer=AgroSolutions
      - Jwt__Audience=AgroSolutions
    depends_on:
      postgres:
        condition: service_healthy

  ingestion-service:
    build:
      context: .
      dockerfile: src/IngestionService/Dockerfile
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
      - Jwt__Key=AgroSolutions-Secret-Key-For-JWT-Authentication-2024
      - Jwt__Issuer=AgroSolutions
      - Jwt__Audience=AgroSolutions
    depends_on:
      rabbitmq:
        condition: service_healthy

  alert-service:
    build:
      context: .
      dockerfile: src/AlertService/Dockerfile
    environment:
      - DOTNET_ENVIRONMENT=Development
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:
