apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: agrosolutions
data:
  datasources/datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false

  dashboards/dashboard.yaml: |
    apiVersion: 1
    providers:
      - name: AgroSolutions
        orgId: 1
        folder: AgroSolutions
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
