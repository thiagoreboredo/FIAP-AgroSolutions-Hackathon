apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: agrosolutions
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'identity-service'
        static_configs:
          - targets: ['identity-service:80']
        metrics_path: /metrics

      - job_name: 'property-service'
        static_configs:
          - targets: ['property-service:80']
        metrics_path: /metrics

      - job_name: 'ingestion-service'
        static_configs:
          - targets: ['ingestion-service:80']
        metrics_path: /metrics

      - job_name: 'alert-service'
        static_configs:
          - targets: ['alert-service:80']
        metrics_path: /metrics

      - job_name: 'rabbitmq'
        static_configs:
          - targets: ['rabbitmq:15692']
        metrics_path: /metrics
