apiVersion: apps/v1
kind: Deployment
metadata:
  name: property-service
  namespace: agrosolutions
spec:
  replicas: 2
  selector:
    matchLabels:
      app: property-service
  template:
    metadata:
      labels:
        app: property-service
    spec:
      containers:
        - name: property-service
          image: agrosolutions/property-service:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: property-service-config
            - secretRef:
                name: property-service-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
